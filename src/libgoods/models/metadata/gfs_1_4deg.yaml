identifier: GFS_1_4DEG
name: Global Winds (GFS-1/4 degree)
long_name: NOAA/NCEP Global Forecast System (GFS), 1/4 degree horizontal resolution
html_desc: The <a href="https://www.emc.ncep.noaa.gov/emc/pages/numerical_forecast_systems/gfs.php" 
            target="_blank">Global Forecast System</a> is NOAA/NCEP's weather forecat model that provides 
            global atmospheric predictions at 13 km resolution. The model output is available through the 
            <a href="https://ncar.ucar.edu/" target="_blank">University Corporation for Atmospheric 
            Research (UCAR)</a> data server at a variety of resolutions. WebGNOME accesses the 1/4 
            degree resolution output (the highest offered).
regional: false
