name: NGOFS2_RGRID
description: NOAA/NOS Northern Gulf of America Operational Forecast System,  interpolated to regular grid.
metadata:
  long_name: Northern Gulf of America
  html_desc: A <a href="http://tidesandcurrents.noaa.gov/ofs/ngofs2/ngofs2.html" target="_blank">
    Northern Gulf of America Operational Forecast System (NGOFS)</a>
    was developed in a joint project of the
    <a href="http://www.nauticalcharts.noaa.gov/" target="_blank">
    NOAA/National Ocean Service's (NOS) Office of Coast Survey </a>,
    the <a href="http://tidesandcurrents.noaa.gov/" target="_blank">
    NOAA/NOS Center for Operational Oceanographic Products and Services (CO-OPS)</a>,
    the <a href="http://mag.ncep.noaa.gov" target="_blank">
    NOAA/National Weather Service's (NWS) National Centers
    for Environmental Prediction (NCEP) Central Operations (NCO)</a>, and the
    <a href="http://fvcom.smast.umassd.edu/" target="_blank">
    University of Massachusetts, Dartmouth </a> using the Finite Volume Coastal Ocean
    Model (FVCOM).
    For detailed model information, visit the NOAA CO-OPS
    <a href="http://tidesandcurrents.noaa.gov/ofs/ngofs2/ngofs_info.html" target="_blank">
    model information page</a>. <br></br>
    <p><b> This output is interpolated onto a regular grid and is lower resolution than the original output.</b> For higher resolution, model output on the native grid can be downloaded using the <a href = "https://opendap.co-ops.nos.noaa.gov/ofsdataagg/ngofs2.html" target="_blank">CO-OPS OFS Data Aggregation and Sub-setting</a> utility and manually loaded into WebGNOME.</p>
  grid_dim_(xyz): [1217,904,35]
  grid_res_min_(km): 1
  grid_res_max_(km): 1
  grid_type: 'curvilinear'
  alpha_shape: [20,1]  # dd, alpha
  filetype: 'regulargrid'

sources:
  ioos-forecast-agg:
    driver: opendap
    description: 3D Northern Gulf of America model in FVCOM, interpolated to regular grid, from 1 day ago with 54 hour forecast.
    args:
      drop_variables: ['ocean_time']
      engine: netcdf4
      urlpath: http://tds.ioos.us/thredds/dodsC/ioos/ofs/ngofs2/forecast/regulargrid/NGOFS2_Forecast_Regulargrid_best.ncd
    metadata:
      overall_start_datetime: 'starting 1 month before present day'
      overall_end_datetime: '54 hours after present time'
      output_period_(hr): 3
      axis:
        T: time
        X: nx
        Y: ny
        Z: Depth
      standard_names:
        eastward_sea_water_velocity: u_eastward
        northward_sea_water_velocity: v_northward
        sea_floor_depth: h
        sea_surface_elevation: zeta
        sea_water_temperature: temp
        sea_water_practical_salinity: salt
        time: time
        longitude: Longitude
        latitude: Latitude

  coops-forecast-noagg:
    description: Unaggregated 3D Northern Gulf of America model in FVCOM, interpolated to regular grid, from 1 day ago with 54 hour forecast.
    args:
      chunks:
        ocean_time: 1
      drop_variables: ['Itime2']
      compat: override
      combine: by_coords
      parallel: True
      data_vars: minimal
      coords: minimal
      engine: netcdf4
      urlpath:
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/NGOFS2/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.ngofs2.regulargrid.n000.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/NGOFS2/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.ngofs2.regulargrid.n003.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
    parameters:
      yesterday:
        description: Pandas like Timestamp for yesterday
        type: datetime  # one of bool, str, int, float, list[str | int | float], datetime,
    driver: opendap
    metadata:
      sample_locs:
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/NGOFS2/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.ngofs2.regulargrid.n000.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/NGOFS2/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.ngofs2.regulargrid.n003.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
      catloc: 'https://opendap.co-ops.nos.noaa.gov/thredds/catalog/NOAA/NGOFS2/MODELS/catalog.xml'
      overall_start_datetime: 'starting 1 day before present day'
      overall_end_datetime: '54 hours after present time'
      output_period_(hr): 3
      axis:
        T: ocean_time
        X: nx
        Y: ny
        Z: Depth
      standard_names:
        eastward_sea_water_velocity: u_eastward
        northward_sea_water_velocity: v_northward
        sea_floor_depth: h
        sea_surface_elevation: zeta
        sea_water_temperature: temp
        sea_water_practical_salinity: salt
        time: ocean_time
        longitude: Longitude
        latitude: Latitude
