name: CREOFS_RGRID
description: 3D Columbia River model in SELFE, interpolated to regular grid.
metadata:
  long_name: Columbia River
  html_desc: The <a href="http://tidesandcurrents.noaa.gov/ofs/creofs/creofs.html" target="_blank">
    Columbia River Estuary Operational Forecast System (CREOFS)</a> was
    jointly developed by the <a href="http://www.ohsu.edu/xd/" target="_blank">
    Oregon Health & Science University (OHSU)</a>,
    the <a href="http://www.nauticalcharts.noaa.gov/" target="_blank">
    NOAA/National Ocean Service's (NOS) Office of Coast Survey </a> and
    <a href="http://tidesandcurrents.noaa.gov/" target="_blank">
    Center for Operational Oceanographic Products and Services (CO-OPS)</a>,
    and the <a href="http://mag.ncep.noaa.gov" target="_blank">
    NOAA/National Weather Service's (NWS) National Centers
    for Environmental Prediction (NCEP) Central Operations (NCO)</a>.
    The CREOFS model domain includes the upper and lower Columbia River and Estuary.
    For detailed model information, visit the NOAA CO-OPS
    <a href="http://tidesandcurrents.noaa.gov/ofs/creofs/creofs_info.html" target="_blank">
    model information page</a>.<br>
    <p><b> This output is interpolated onto a regular grid and is lower resolution than the original output.</b></p>
  grid_dim_(xyz): [612,1111,39]
  grid_res_min_(km): 1
  grid_res_max_(km): 1
  grid_type: 'curvilinear'
  alpha_shape: [2,4]  # dd, alpha
  filetype: 'regulargrid'

sources:
  ioos-forecast-agg:
    driver: opendap
    description: Aggregated Columbia River model in SELFE, interpolated to regular grid, from 1 day ago with 48 hour forecast.
    args:
      drop_variables: ['ocean_time']
      engine: netcdf4
      urlpath: https://tds.ioos.us/thredds/dodsC/ioos/ofs/creofs/forecast/regulargrid/CREOFS_Forecast_Regulargrid_best.ncd
    metadata:
      overall_start_datetime: '1 month before present time'
      overall_end_datetime: '48 hours after present time'
      output_period_(hr): 1
      axis:
        T: time
        X: nx
        Y: ny
        Z: Depth
      standard_names:
        eastward_sea_water_velocity: u_eastward
        northward_sea_water_velocity: v_northward
        sea_floor_depth: h
        sea_surface_elevation: zeta
        sea_water_temperature: temp
        sea_water_practical_salinity: salt
        time: time
        longitude: Longitude
        latitude: Latitude

  coops-forecast-noagg:
    description: Unaggregated Columbia River model in SELFE, interpolated to regular grid, from 1 day ago with 48 hour forecast.
    args:
      chunks:
        ocean_time: 1
      drop_variables: ['siglay','siglev','Itime2']
      compat: override
      combine: by_coords
      parallel: True
      data_vars: minimal
      coords: minimal
      engine: netcdf4
      urlpath:
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/CREOFS/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.creofs.regulargrid.n000.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/CREOFS/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.creofs.regulargrid.n001.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
    parameters:
      yesterday:
        description: Pandas like Timestamp for yesterday
        type: datetime  # one of bool, str, int, float, list[str | int | float], datetime,
    driver: opendap
    metadata:
      sample_locs:
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/CREOFS/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.creofs.regulargrid.n000.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
        - "https://opendap.co-ops.nos.noaa.gov/thredds/dodsC/NOAA/CREOFS/MODELS/{{yesterday.year}}/{{yesterday.strftime('%m')}}/{{yesterday.strftime('%d')}}/nos.creofs.regulargrid.n001.{{yesterday.year}}{{yesterday.strftime('%m')}}{{yesterday.strftime('%d')}}.t03z.nc"
      catloc: 'https://opendap.co-ops.nos.noaa.gov/thredds/catalog/NOAA/CREOFS/MODELS/catalog.xml'
      overall_start_datetime: 'starting 1 day before present day'
      overall_end_datetime: '48 hours after present time'
      output_period_(hr): 1
      axis:
        T: ocean_time
        X: nx
        Y: ny
        Z: Depth
      standard_names:
        eastward_sea_water_velocity: u_eastward
        northward_sea_water_velocity: v_northward
        sea_floor_depth: h
        sea_surface_elevation: zeta
        sea_water_temperature: temp
        sea_water_practical_salinity: salt
        time: ocean_time
        longitude: Longitude
        latitude: Latitude
