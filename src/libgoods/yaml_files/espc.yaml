name: ESPC
description: Global Navy Earth System Prediction Capability
metadata:
  long_name: Navy Earth System Prediction Capability
  html_desc:
            The global Navy Earth System Prediction Capability (Navy-ESPC) is a coupled atmosphere-ocean-sea ice prediction system developed at the <a href="https://www.nrl.navy.mil/" target="_blank">Naval Research Laboratory (NRL)</a> for operational forecasting.
            ESPC Version 1 is run operationally by the
            <a href="https://www.metoc.navy.mil/fnmoc/fnmoc.html" target="_blank">
            Fleet Numerical Meteorology and Oceanography Center (FNMOC)</a> and accessed through
            <a href="https://hycom.org" target="_blank"> HYCOM.org</a> at 1/12 degree resolution.

  grid_dim_(xyz): [4500,4251]
  grid_res_min_(deg): 1/12
  grid_res_max_(deg): 1/12
  grid_type: 'rectangular'

sources:
  hycom-forecast-agg:
    driver: opendap
    description: Aggregated Navy Earth System Prediction Capability model output from last few weeks with 7 day forecast.
    args:
      # do not use chunks with this server!
      # chunks:
      #   time: 1
      drop_variables: ['tau']
      engine: netcdf4
      urlpath: https://tds.hycom.org/thredds/dodsC/FMRC_ESPC-D-V02_ice/FMRC_ESPC-D-V02_ice_best.ncd
    metadata:
      overall_start_datetime: '7 days before present time'
      overall_end_datetime: '7 days after present time'
      output_period_(hr): 1
      axis:
        T: time
        X: lon
        Y: lat
      standard_names:
        eastward_sea_water_velocity: ssu
        northward_sea_water_velocity: ssv
        sea_water_temperature: sst
        sea_water_practical_salinity: sss
        time: time
        latitude: lat
        longitude: lon

