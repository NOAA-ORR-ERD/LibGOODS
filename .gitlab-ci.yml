variables:
  PYTHON_VER: '3.12'
  IMAGE_NAME: '/erd/environments/ubuntu/ubuntuforge-python'
  GIT_DEPTH: 2

stages:
  - lint
  - test
  - data

cache:
  paths:
    - ./$CI_PIPELINE_ID

before_script:
  - pwd
  - echo $CI_PIPELINE_ID
  - source activate ./$CI_PIPELINE_ID

configure_env:
  stage: .pre
  image: registry.orr.noaa.gov$IMAGE_NAME$PYTHON_VER
  before_script:
    - echo '' # manual override of before_script because we're on runner 12.3 and inherit options are only 12.9+
  script:
    - conda create --prefix ./$CI_PIPELINE_ID
  tags:
    - docker
  artifacts:
    expire_in: 5 days
    paths:
      - ./$CI_PIPELINE_ID
  rules:
    - if: $SCHEDULED == "true"
      when: never
    - if: $CI_COMMIT_REF_NAME
      when: always

lint_libgoods:
  stage: lint
  allow_failure: true
  image: registry.orr.noaa.gov$IMAGE_NAME$PYTHON_VER
  script:
    - conda install -y flake8
    - python -m flake8 --statistics src/libgoods
  rules:
    - if: $SCHEDULED == "true"
      when: never
    - if: $CI_COMMIT_REF_NAME
      when: always

test_libgoods:
  stage: test
  allow_failure: false
  image: registry.orr.noaa.gov$IMAGE_NAME$PYTHON_VER
  script:
    - conda install -y python=$PYTHON_VER --file conda_requirements_test.txt
      --file conda_requirements.txt
    - conda install git  # need git to install xarray_subset_grid
    # need xarray_subset_grid -- not released yet
    - pip install
      xarray_subset_grid@git+https://github.com/asascience-open/xarray-subset-grid.git

    - pip install ./

    - pytest --pyargs libgoods
  rules:
    - if: $SCHEDULED == "true"
      when: never
    - if: $CI_COMMIT_REF_NAME
      when: always

populate data on mac pro:
  stage: data
  needs: []
  before_script: []
  script:
    - ./example_scripts/aws-mirror-matrix.sh
  rules:
    - if: $SCHEDULED == "true"
      when: always
  tags:
    - macOS
  parallel:
    matrix:
      - MODEL: 'wcofs'
        PATTERN: '2ds'
      - MODEL: 'sscofs'
      - MODEL: 'ngofs2'
        PATTERN: '2ds'
      - MODEL: 'cbofs'
      - MODEL: 'tbofs'
      - MODEL: 'dbofs'
      - MODEL: 'gomofs'
        PATTERN: '2ds'
      - MODEL: 'ciofs'
      - MODEL: 'sfbofs'
      - MODEL: 'leofs'
      - MODEL: 'lmhofs'
      - MODEL: 'loofs'
      - MODEL: 'lsofs'
      - MODEL: 'wcofs'
        PATTERN: '2ds'
        CAST: '.f'
      - MODEL: 'sscofs'
        CAST: '.f'
      - MODEL: 'ngofs2'
        CAST: '.f'
        PATTERN: '2ds'
      - MODEL: 'cbofs'
        CAST: '.f'
      - MODEL: 'tbofs'
        CAST: '.f'
      - MODEL: 'dbofs'
        CAST: '.f'
      - MODEL: 'gomofs'
        PATTERN: '2ds'
        CAST: '.f'
      - MODEL: 'ciofs'
        CAST: '.f'
      - MODEL: 'sfbofs'
        CAST: '.f'
      - MODEL: 'leofs'
        CAST: '.f'
      - MODEL: 'lmhofs'
        CAST: '.f'
      - MODEL: 'loofs'
        CAST: '.f'
      - MODEL: 'lsofs'
        CAST: '.f'

tidy forcast data:
  stage: data
  needs: []
  before_script: []
  script:
    - ./example_scripts/aws-purge-old-forcasts.sh
    - ./example_scripts/aws-purge-old-nowcasts.sh
  rules:
    - if: $SCHEDULED == "true"
    - if: $TIDY == "true"
      when: always
  tags:
    - macOS
