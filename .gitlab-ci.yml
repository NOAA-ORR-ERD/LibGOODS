variables:
  PYTHON_VER: "3.9"
  IMAGE_NAME: "miniforge-python"
  GIT_DEPTH: 2

stages:
  - lint
  - test

cache:
  paths:
    - ./$CI_PIPELINE_ID

before_script:
  - pwd
  - echo $CI_PIPELINE_ID
  - source activate ./$CI_PIPELINE_ID

configure_env:
  stage: .pre
  image: registry.orr.noaa.gov/erd/centos-conda/$IMAGE_NAME$PYTHON_VER
  before_script:
    - echo '' # manual override of before_script because we're on runner 12.3 and inherit options are only 12.9+
  script:
    - conda create --prefix ./$CI_PIPELINE_ID
  tags:
    - docker
  artifacts:
    expire_in: 5 days
    paths:
      - ./$CI_PIPELINE_ID

lint_libgoods:
  stage: lint
  allow_failure: true
  image: registry.orr.noaa.gov/erd/centos-conda/$IMAGE_NAME$PYTHON_VER
  script:
    - conda install -y flake8
    - python -m flake8 --statistics src/libgoods


test_libgoods:
  stage: test
  allow_failure: false
  image: registry.orr.noaa.gov/erd/centos-conda/$IMAGE_NAME$PYTHON_VER
  script:
    - conda install -y python=$PYTHON_VER --file conda_requirements_test.txt
                                          --file conda_requirements.txt

    - pip install ./

    - cd ../  # make sure that it won't find the source package.
    - pytest --pyargs libgoods
