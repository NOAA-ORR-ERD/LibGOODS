# new CI using pixi to run tests, etc.

variables:
  IMAGE_NAME: 'registry.orr.noaa.gov/erd/environments/ubuntu-pixi:latest'
  GIT_DEPTH: 2

stages:
  - lint
  - test
  - test_multi_py
  - build
  - test_op_servers

# cache:
#   paths:
#    - ./.pixi

lint_libgoods:
  stage: lint
  allow_failure: true
  image: $IMAGE_NAME
  script:
    - pixi run lint

test_libgoods:
  stage: test
  allow_failure: false
  image: $IMAGE_NAME
  script:
    - pixi run test

test_multi_py:
  stage: test_multi_py
  allow_failure: false
  image: $IMAGE_NAME
  script:
    - pixi run -e test312 test
    - pixi run -e test313 test
    - pixi run -e test314 test

test_operational_services:
  stage: test_op_servers
  allow_failure: false
  image: $IMAGE_NAME
  script:
    - pixi run ops_tests

build_wheel:
  stage: build
  allow_failure: false
  image: $IMAGE_NAME
  script:
    - pixi run build_wheel
  # rules:
  #   - if: $SCHEDULED == "true"
  #     when: never
  #   - if: $CI_COMMIT_REF_NAME
  #     when: always
