[workspace]
authors = ["Chris Barker <Chris.Barker@noaa.gov>",
           "Amy MacFadyen <amy.macfadyen@noaa.gov>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.12,<3.15"
xarray-subset-grid = ">=0.1.1"
netCDF4 = "*"
numpy = "*"
requests = "*"
shapely = "*"
pandas = "*"
siphon = "*"
fiona = "*"
cfgrib = "*"
pyyaml = "*"
s3fs = "*"
zarr = "<3"
awscli = "*"

[feature.dev.dependencies]
ipython = "*"
matplotlib = "*"

[feature.dev.pypi-dependencies]
libgoods = { path = ".", editable = true }

[feature.build.dependencies]
pip = "*"
python-build = "*"
setuptools = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.py312.dependencies]
python = "~=3.12.0"

[feature.py313.dependencies]
python = "~=3.13.0"

[feature.py314.dependencies]
python = "~=3.14.0"

[environments]
default = ["dev"]
# using the oldest supported version for development
dev = ["py312", "dev", "test", "build"]
dev313 = ["py313", "dev", "test", "build"]
dev314 = ["py314", "dev", "test", "build"]
build = ["py312", "build"]
test312 = [ "py312", "test", "build"]
test313 = [ "py313", "test", "build"]
test314 = [ "py314", "test", "build"]

[tasks]
install = { cmd = "pip install -v --no-deps ./", default-environment = "build"}
build_wheel = {cmd = "python -m build ./", default-environment = "build"}
test = { cmd = "pytest --pyargs libgoods", depends-on = ["install"] }


