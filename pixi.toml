[workspace]
authors = ["Chris Barker <Chris.Barker@noaa.gov>",
           "Amy MacFadyen <amy.macfadyen@noaa.gov>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[pypi-dependencies]
libgoods = { path = ".", editable = true }

[dependencies]
python = ">=3.10,<3.15"
xarray-subset-grid = ">=0.1.1"
netCDF4 = "*"
numpy = "*"
requests = "*"
shapely = "*"
pandas = "*"
siphon = "*"
fiona = "*"
cfgrib = "*"
pyyaml = "*"
s3fs = "*"
zarr = "<3"
awscli = "*"

[feature.dev.dependencies]
ipython = "*"
pytest = "*"
matplotlib = "*"
pytest-cov = "*"

[feature.py312.dependencies]
python = "~=3.12.0"

[feature.py313.dependencies]
python = "~=3.13.0"

[feature.py314.dependencies]
python = "~=3.14.0"

[environments]
default = { solve-group = "default" }
dev = ["py312", "dev"]
py312 = [ "py312" ]
py313 = [ "py313" ]
py314 = [ "py314" ]

