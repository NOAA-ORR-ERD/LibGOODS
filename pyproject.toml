[build-system]
requires = ["setuptools"] # maybe later "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "libgoods"
authors = [
    {name = "Amy MacFadyen", email = "amy.macfadyen@noaa.gov"},
    {name = "Christopher H. Barker", email = "chris.barker@noaa.gov"},
]
description = "Package for retrieving environmental data for GNOME"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Meteorology/Oceanography",
]
dynamic = ["version"]

dependencies = [
    "xarray-subset-grid>=0.1.0",
    "netCDF4",
    "numpy>=2.2",
    "requests",
    "shapely",
    "s3fs",
    "pandas",
    "yaml",
    "siphon",
    "fiona",
    "cfgrib",
]

[tool.setuptools.dynamic]
version = {attr = "libgoods.__version__"}
readme = {file = ["README.rst"]}

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/NOAA-ORR-ERD/libGOODS"


[project.scripts]
#     # does this work?? -- left over from model_catalogs
#     fetch-model = "libgoods.cli:main"
shift_bna = "libgoods.scripting.shift_bna:main"

[tools.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libgoods = ["shoreline_data/nos_shoreline/*",
            "shoreline_data/gshhg/**/*",
            "models/metadata/*.yaml",
            "tests/test_utilities/data_files/*",
            ]
# I could not get exclude to work ?????
# [tool.setuptools.exclude-package-data]
# # these are really big -- excluding them until they are used.
# libgoods = ["shoreline_data/OpenStreetMap/land-polygons-complete-4326/*",
#             "shoreline_data/AK_CUSP/*"]

[tool.ruff]
builtins = ["ellipsis"]
# extend-exclude = ["xarray_subset_grid/_version.py"]
target-version = "py310"
# Use a longer line length.
line-length = 100

[tool.ruff.lint]
ignore = [
  "E402", # module level import not at top of file
#  "E731", # do not assign a lambda expression, use a def
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "W",
  "TID", # flake8-tidy-imports (absolute imports)
  "I",   # isort
  "UP",  # Pyupgrade
]
extend-safe-fixes = [
  "TID252", # absolute imports
]

[tool.ruff.lint.per-file-ignores]
# examples
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
# "__init__.py" = ["E402"]
# "path/to/file.py" = ["E402"]
"src/libgoods/utilities/haz_files.py" = ["UP031"]
"src/libgoods/models/__init__.py" = ["F401"]
"src/libgoods/NWS_point.py" = ["UP031"]
"docs/conf.py" = ["I001"]


