[build-system]
requires = ["setuptools"] # maybe later "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "libgoods"
authors = [
    {name = "Amy MacFadyen", email = "amy.macfadyen@noaa.gov"},
    {name = "Christopher H. Barker", email = "chris.barker@noaa.gov"},
]
description = "Package for retrieving environmental data for GNOME"
requires-python = ">=3.10"
license = {text = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"}
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Meteorology/Oceanography",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "libgoods.__version__"}
readme = {file = ["README.rst"]}

# use conda -- so not here??
# dependencies = [
#     "requests",
#     'importlib-metadata; python_version<"3.8"',
# ]

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/NOAA-ORR-ERD/libGOODS"


# [project.optional-dependencies]
# pdf = ["ReportLab>=1.2", "RXP"]

# we should have some here!
# [project.scripts]
#     # does this work?? -- left over from model_catalogs
#     fetch-model = "libgoods.cli:main"

[tools.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libgoods = ["yaml_files/*.yaml",
            "yaml_files/boundaries/*.yaml"]

[tool.ruff]
builtins = ["ellipsis"]
extend-exclude = ["xarray_subset_grid/_version.py"]
target-version = "py310"
# Use a longer line length.
line-length = 100

[tool.ruff.lint]
ignore = [
  "E402", # module level import not at top of file
#  "E731", # do not assign a lambda expression, use a def
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "W",
  "TID", # flake8-tidy-imports (absolute imports)
  "I",   # isort
  "UP",  # Pyupgrade
]
extend-safe-fixes = [
  "TID252", # absolute imports
]
