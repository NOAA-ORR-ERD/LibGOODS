[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "libgoods"
authors = [
    {name = "Amy MacFadyen", email = "amy.macfadyen@noaa.gov"},
    {name = "Christopher H. Barker", email = "chris.barker@noaa.gov"},
]
description = "Package for retrieving environmental data for GNOME"
requires-python = ">=3.12"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Meteorology/Oceanography",
]
dynamic = ["version"]

dependencies = [
    "xarray-subset-grid>=0.1.0",
    "netCDF4",
    "numpy>=2.4",
    "requests",
    "shapely",
    "pandas",
    "pyyaml",
    "siphon",
    "fiona",
    "cfgrib",
    "s3fs",
    "zarr<3",
]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}

[tool.setuptools_scm]
version_file = "src/libgoods/_version.py"

[project.urls]
Homepage = "https://github.com/NOAA-ORR-ERD/libGOODS"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/NOAA-ORR-ERD/libGOODS"


[project.scripts]
lg_shift_bna = "libgoods.scripting.shift_bna:main"
lg_get_ndbc = "libgoods.NDBC:get_wind_from_ndbc_script"
lg_build_cache = "libgoods.scripting.build_cache:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libgoods = ["shoreline_data/nos_shoreline/*",
            "shoreline_data/gshhg/**/*",
            "models/metadata/*.yaml",
            "tests/test_utilities/data_files/*",
            "tests/sample_metdata/*",
            ]
# I could not get exclude to work ?????
# setuptools_scm overrides it anyway
# MANIFEST.in has it

[tool.ruff]
builtins = ["ellipsis"]
# extend-exclude = ["xarray_subset_grid/_version.py"]
target-version = "py312"
# Use a longer line length.
line-length = 100

[tool.ruff.lint]
ignore = [
  "E402", # module level import not at top of file
#  "E731", # do not assign a lambda expression, use a def
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "W",
  "TID", # flake8-tidy-imports (absolute imports)
  "I",   # isort
  "UP",  # Pyupgrade
]
extend-safe-fixes = [
  "TID252", # absolute imports
]

[tool.ruff.lint.per-file-ignores]
# examples
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
# "__init__.py" = ["E402"]
# "path/to/file.py" = ["E402"]
"src/libgoods/utilities/haz_files.py" = ["UP031"]
"src/libgoods/models/__init__.py" = ["F401"]
"src/libgoods/NWS_point.py" = ["UP031"]
"docs/conf.py" = ["I001"]


